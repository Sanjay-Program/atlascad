[package]
name = "cadcraft-doc"
description = "CADCraft drawing database: entities, symbol tables, blocks, layouts, copy-on-write store"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# On by default: `Handle` converts to the contract's `EntityId` and the header maps `$INSUNITS`
# to its `Unit`. Turn it off for a build that must not carry the shared crate.
default = ["cad-contract"]
cad-contract = ["dep:cad-contract"]

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
cad-contract = { workspace = true, optional = true }

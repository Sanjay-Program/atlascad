[package]
name = "cad-studio"
description = "Local-first Atlas CAD desktop application shell: project browser, parameter editor, 3D viewport, save and STL export."
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cad-contract.workspace = true
cad-document.workspace = true
cad-kernel-truck.workspace = true
cad-io.workspace = true
cad-drafting.workspace = true
cad-engineering-model.workspace = true
cad-engineering = { path = "../cad-engineering" }
cad-cae.workspace = true
cad-cam.workspace = true
cad-constraints.workspace = true
atlas-core.workspace = true
atlas-dependency-graph.workspace = true
atlas-simulation-core.workspace = true
atlas-engine-manager.workspace = true
atlas-audit.workspace = true
atlas-compliance.workspace = true
atlas-job-queue.workspace = true
atlas-organization.workspace = true
atlas-additive.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The HTTP tests reopen a saved project to prove that provenance survives a restart.
cad-document = { path = "../cad-document" }

[lints]
workspace = true

[lib]
name = "cad_studio"
path = "src/lib.rs"

[[bin]]
name = "cad-studio"
path = "src/main.rs"

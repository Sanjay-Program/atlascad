[package]
name = "cadrust-cli"
description = "cadrust command line: run documents, convert STEP, inspect files, serve the web app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "cadrust"
path = "src/main.rs"

[dependencies]
cadrust-core = { path = "../cadrust-core" }
cadrust-addin = { path = "../cadrust-addin" }
cadrum = { version = "0.9", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

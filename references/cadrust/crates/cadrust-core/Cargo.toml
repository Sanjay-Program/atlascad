[package]
name = "cadrust-core"
description = "Document model, expressions and timeline evaluation for cadrust on top of OpenCascade (cadrum)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cadrum = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evalexpr = "12"
ezpz = { package = "kcl-ezpz", version = "0.2" }
thiserror = "2"

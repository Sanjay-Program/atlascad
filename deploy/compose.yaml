# One-command hosted Atlas CAD Studio — single host, single document, TLS via Caddy.
#
# Two services, one host:
#   - atlas-studio : the atlas-studio:<version> runtime image, one document in /data
#   - atlas-proxy  : caddy:<version> terminating TLS on a public name
#
# This is the "hosted, for now" shape: one bearer token, all-or-nothing, every holder can edit.
# It is NOT multi-tenant SaaS (no accounts, no per-user permissions, no revocation except restart,
# no multi-document mode). N documents = N such compose stacks or N systemd units.
#
# Prerequisites on the host:
#   - Docker + Docker Compose.
#   - A DNS name pointing at this host, ports 80 and 443 open to the internet.
#   - A token file, 0600, at $STUDIO_TOKEN_FILE (default ./studio-token.txt).
#
# Start (public name + TLS):
#   cd deploy
#   ./gen-token.sh                        # writes deploy/studio-token.txt, 0600
#   STUDIO_PUBLIC_HOST=cad.example.com \
#   STUDIO_TOKEN_FILE=./studio-token.txt \
#   docker compose up -d --wait
#
# The leading ./ matters: compose reads a bare name as a named volume, not a bind mount.
#
# Or, with the same checks plus a preflight, one command:
#   STUDIO_PUBLIC_HOST=cad.example.com ./up.sh
#
# Local smoke (localhost, Caddy self-signs a dev cert):
#   ./smoke.sh                            # builds if needed, runs the whole proofline, tears down
#
# Stop and remove:
#   docker compose down          # keep the document volume
#   docker compose down -v       # also remove the document volume
#
# Back up / restore the document volume:
#   ./backup.sh                  # dated tar.gz + SHA256 in deploy/backups/
#   ./restore.sh --file deploy/backups/<archive>.tar.gz --yes
#
# See docs/operations/deployment.md for the contract, the token model, backups and what this
# deployment does not give you.

# A fixed project name (overridable with -p) keeps the volume names stable for backup.sh and
# restore.sh: atlas_atlas-studio-data. Without it the project name is the directory, "deploy".
name: atlas

services:
  # One-shot: stage the operator's 0600 token file into a private volume as a readable file. The
  # host file stays owned by the operator and unreadable to anyone else; the studio's uid 10001 can
  # read the copy, and the token never enters a container environment (so `docker inspect` shows no
  # secret). Compose ignores uid/gid/mode on `secrets` and bind-mounts the host file as-is, which is
  # why this step exists rather than a plain `secrets:` entry.
  atlas-token:
    image: atlas-studio:${STUDIO_IMAGE_TAG:-0.1.0}
    user: "0:0"
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Root without DAC_READ_SEARCH cannot read a 0600 file owned by the host operator (measured:
    # `install: cannot open '/source/token': Permission denied`). These two are the minimum for a
    # one-shot copy and go away with the container; the studio itself still has no capabilities.
    cap_add:
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
    entrypoint: ["/bin/sh", "-c"]
    command:
      - install -m 0444 /source/token /run/secrets/atlas-studio-token
    volumes:
      - ${STUDIO_TOKEN_FILE:-./studio-token.txt}:/source/token:ro,z
      - atlas-studio-secret:/run/secrets

  atlas-studio:
    image: atlas-studio:${STUDIO_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    # The image already runs as uid 10001; naming it here keeps `ps` and the secret ownership
    # obvious, and keeps a future image change from silently running the studio as root.
    user: "10001:10001"
    # The studio writes only inside the /data volume (the document, its autosave and its backup),
    # so nothing outside it needs to be writable.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    stop_grace_period: 15s
    environment:
      ATLAS_PROJECT: /data/part.zcad
      ATLAS_PORT: "7519"
      # Do not set ATLAS_HOST here: leave it at the image default (0.0.0.0) so docker port
      # mapping works. The host-side mapping -p 127.0.0.1:7519:7519 already restricts host
      # exposure to loopback, which is the security boundary we want. (Setting ATLAS_HOST to
      # 127.0.0.1 makes the studio bind 127.0.0.1 inside the container, and docker-proxy then
      # cannot reach it because it connects to the container's own IP, not loopback.)
      ATLAS_ADVERTISE: ${STUDIO_PUBLIC_HOST:?set STUDIO_PUBLIC_HOST to the DNS name users open}
      ATLAS_NAME: ${STUDIO_NAME:-part}
      ATLAS_SIZE: ${STUDIO_SIZE:-40,30,10}
      # The token is read from a file, not from the environment: an environment variable is
      # visible in `docker inspect` and to anything that can read the container's config.
      ATLAS_STUDIO_TOKEN_FILE: /run/secrets/atlas-studio-token
    volumes:
      - atlas-studio-data:/data
      - atlas-studio-secret:/run/secrets:ro
    depends_on:
      atlas-token:
        condition: service_completed_successfully
    # Bind to loopback only. The public name reaches the studio through the proxy. The host port is
    # configurable so a second stack (a smoke run, or a second document) can start beside the first
    # without a bind conflict; the container always listens on 7519.
    ports:
      - "127.0.0.1:${STUDIO_BIND_PORT:-7519}:7519"
    # No healthcheck override on purpose: the image's own check is a real GET /api/health over
    # bash's /dev/tcp, so a process that is alive but wedged is reported unhealthy. `--wait` and
    # the proxy's depends_on both read it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  atlas-proxy:
    image: caddy:${CADDY_IMAGE_TAG:-2}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Root inside the container still needs this one capability to bind 80/443.
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    # Host ports are configurable for the same reason as STUDIO_BIND_PORT: a smoke run owns
    # 8080/8443 while a real deployment keeps 80/443. Behind a load balancer, publish nothing.
    ports:
      - "${STUDIO_HTTP_PORT:-80}:80"
      - "${STUDIO_HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDY_FILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro,z
      - atlas-caddy-data:/data
      - atlas-caddy-config:/config
      # The access log records the request URI, and a shared link carries the token in the query
      # string. Keep this volume on the host, 0600, rotated and never shipped anywhere.
      - atlas-caddy-log:/var/log/caddy
    environment:
      # Both names are consumed by the Caddyfile; nothing about the public name is hardcoded in it.
      STUDIO_PUBLIC_HOST: ${STUDIO_PUBLIC_HOST:?set STUDIO_PUBLIC_HOST to the DNS name users open}
      STUDIO_UPSTREAM: atlas-studio:7519
    depends_on:
      atlas-studio:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  atlas-studio-data:
  atlas-studio-secret:
  atlas-caddy-data:
  atlas-caddy-config:
  atlas-caddy-log:
